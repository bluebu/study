{#-
  按页注入的两套色，写在 <head> 里（page.render 的 extra_head）。

    --read / --read-bg   整页主色，跟着**分类**走（听 / 读 / 词 / 练 / 语）
    --score / --score-bg 只给总分那个圈和四维条，跟着**分数**走（越差越红）

  两套是有意分开的：分类色说「这是哪一类」，分数色说「做得怎么样」，
  同一张卡上各管各的。**分类色里刻意没有红** —— 红专属分数。
  色值本身在 palette.css 和 figures.score_color()，这儿只是把它们绑到这一页。
-#}
<style>:root{ --read:var(--c-{{ cat }}); --read-bg:var(--c-{{ cat }}-bg); --score:{{ fg }}; --score-bg:{{ bg }}; }</style>
